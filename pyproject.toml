[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-trading-system"
version = "3.0.0"
description = "中低频量化交易系统 V3"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["16_tests"]
