# ============================================================
# QuantTradingSystem V3
# Risk Management Configuration
# ============================================================

risk:

  # ==========================================================
  # 01. Global Risk Settings
  # 全局风险设置
  # ==========================================================
  global:

    enabled: true

    # 风控模式
    # strict     = 严格风控
    # normal     = 正常风控
    # relaxed    = 宽松风控
    mode: "normal"

    # 风控检查顺序
    pre_trade_check: true
    pre_order_check: true
    post_trade_check: true

    # 风控失败时禁止交易
    block_on_violation: true

    # 是否允许风险规则覆盖策略信号
    risk_override_strategy: true


  # ==========================================================
  # 02. Account Risk
  # 账户级风险
  # ==========================================================
  account:

    # 最低账户净值
    min_equity: 3000.0

    # 最低可用现金
    min_cash: 500.0

    # 最大资金使用率
    max_capital_utilization: 0.90

    # 最大保证金使用率
    max_margin_utilization: 0.70

    # 最大借贷比例
    max_leverage: 1.50

    # 是否允许融资
    allow_margin: false

    # 是否允许负现金
    allow_negative_cash: false


  # ==========================================================
  # 03. Position Risk
  # 单个持仓风险
  # ==========================================================
  position:

    enabled: true

    # 单只股票最大组合权重
    max_stock_weight: 0.10

    # 单只股票最小组合权重
    min_stock_weight: 0.02

    # 单只股票最大名义金额
    max_notional: 2000.0

    # 单只股票最大数量
    max_quantity: 500

    # 单只股票最大风险贡献
    max_risk_contribution: 0.15

    # 单个标的是否允许重复策略持仓
    allow_multiple_strategy_positions: false

    # 是否允许加仓
    allow_pyramiding: false

    # 最大加仓次数
    max_pyramiding: 0


  # ==========================================================
  # 04. Portfolio Risk
  # 组合风险
  # ==========================================================
  portfolio:

    enabled: true

    # 最大总股票仓位
    max_gross_exposure: 0.90

    # 最大净敞口
    max_net_exposure: 0.90

    # 最低现金比例
    min_cash_ratio: 0.10

    # 最大组合波动率
    target_volatility: 0.15
    max_volatility: 0.25

    # 最大组合风险贡献
    max_risk_contribution: 1.00

    # 组合最大持仓数量
    max_positions: 20

    # 最大同时开仓订单数量
    max_open_orders: 20


  # ==========================================================
  # 05. Sector Risk
  # 行业风险
  # ==========================================================
  sector:

    enabled: true

    # 单行业最大权重
    max_sector_weight: 0.30

    # 单行业最小权重
    min_sector_weight: 0.00

    # 单行业最大风险贡献
    max_sector_risk_contribution: 0.35

    # 最大行业数量
    max_sectors: 5

    # 是否进行行业集中度检查
    concentration_check: true

    # 行业权重集中度阈值
    max_concentration_ratio: 0.40


  # ==========================================================
  # 06. Correlation Risk
  # 相关性风险
  # ==========================================================
  correlation:

    enabled: true

    # 相关性计算周期
    lookback: 60

    # 相关系数计算频率
    frequency: "1D"

    # 两个标的之间的最大允许相关系数
    max_pairwise_correlation: 0.85

    # 高相关股票数量限制
    max_high_correlation_positions: 5

    # 高相关阈值
    high_correlation_threshold: 0.80

    # 是否进行相关性聚类
    clustering: true

    # 聚类方法
    clustering_method: "hierarchical"

    # 最大聚类暴露
    max_cluster_weight: 0.40


  # ==========================================================
  # 07. Volatility Risk
  # 波动率风险
  # ==========================================================
  volatility:

    enabled: true

    # 历史波动率窗口
    lookback: 20

    # 年化因子
    annualization_factor: 252

    # 单股票最大年化波动率
    max_stock_volatility: 1.00

    # 组合最大年化波动率
    max_portfolio_volatility: 0.25

    # 高波动标的处理
    high_volatility_action: "REDUCE_POSITION"

    # 极端波动阈值
    extreme_volatility: 1.50

    # 波动率突然增加阈值
    volatility_jump_threshold: 2.00

    # 波动率计算方法
    estimator: "realized"


  # ==========================================================
  # 08. Drawdown Risk
  # 回撤风险
  # ==========================================================
  drawdown:

    enabled: true

    # 警戒线
    warning: 0.05

    # 一级限制
    level_1: 0.08

    # 二级限制
    level_2: 0.10

    # 强制减仓
    level_3: 0.15

    # Kill Switch
    level_4: 0.20

    # 不同回撤等级对应动作
    actions:

      warning: "ALERT"

      level_1: "REDUCE_NEW_RISK"

      level_2: "REDUCE_POSITIONS"

      level_3: "FORCE_DELEVERAGE"

      level_4: "STOP_TRADING"

    # 回撤计算方式
    calculation: "peak_to_trough"

    # 是否使用日内最高净值
    intraday_peak: true


  # ==========================================================
  # 09. VaR Risk
  # Value at Risk
  # ==========================================================
  var:

    enabled: true

    # VaR 置信水平
    confidence_level: 0.99

    # VaR 时间周期
    horizon_days: 1

    # 历史数据窗口
    lookback: 500

    # VaR 方法
    #
    # historical = 历史模拟法
    # parametric = 参数法
    # monte_carlo = 蒙特卡洛
    method: "historical"

    # 最大 VaR 占净资产比例
    max_var_ratio: 0.05

    # VaR 警戒线
    warning_ratio: 0.03

    # 是否计算 Component VaR
    component_var: true

    # 是否计算 Marginal VaR
    marginal_var: true

    # 是否计算 Incremental VaR
    incremental_var: true

    # VaR 超限后的动作
    violation_action: "REDUCE_POSITION"


  # ==========================================================
  # 10. Expected Shortfall / CVaR
  # 尾部风险
  # ==========================================================
  expected_shortfall:

    enabled: true

    # 置信水平
    confidence_level: 0.99

    # 时间周期
    horizon_days: 1

    # 历史数据窗口
    lookback: 500

    # 最大 ES 占净资产比例
    max_es_ratio: 0.08

    # ES 警戒线
    warning_ratio: 0.05

    # 超限动作
    violation_action: "REDUCE_RISK"


  # ==========================================================
  # 11. Stress Testing
  # 压力测试
  # ==========================================================
  stress_test:

    enabled: true

    # 压力测试频率
    frequency: "daily"

    scenarios:

      # ------------------------------------------------------
      # 市场整体下跌
      # ------------------------------------------------------
      market_crash:
        enabled: true
        market_shock: -0.20
        volatility_multiplier: 2.0

      # ------------------------------------------------------
      # 极端市场
      # ------------------------------------------------------
      severe_market_crash:
        enabled: true
        market_shock: -0.30
        volatility_multiplier: 3.0

      # ------------------------------------------------------
      # 科技股冲击
      # ------------------------------------------------------
      technology_shock:
        enabled: true
        sector: "Technology"
        shock: -0.25

      # ------------------------------------------------------
      # 个股极端下跌
      # ------------------------------------------------------
      single_stock_crash:
        enabled: true
        shock: -0.40

      # ------------------------------------------------------
      # 波动率冲击
      # ------------------------------------------------------
      volatility_shock:
        enabled: true
        volatility_multiplier: 2.5

    # 最大压力损失
    max_stress_loss: 0.20


  # ==========================================================
  # 12. Liquidity Risk
  # 流动性风险
  # ==========================================================
  liquidity:

    enabled: true

    # 最低平均成交量
    min_average_volume: 1000000

    # 成交量计算窗口
    volume_lookback: 20

    # 最大参与市场成交量比例
    max_volume_participation: 0.10

    # 最低美元成交额
    min_dollar_volume: 10000000

    # 最大 Bid-Ask Spread
    max_spread_ratio: 0.005

    # 极端流动性不足时动作
    low_liquidity_action: "BLOCK_ORDER"


  # ==========================================================
  # 13. Gap Risk
  # 跳空风险
  # ==========================================================
  gap:

    enabled: true

    # 日开盘跳空警戒
    warning_gap: 0.05

    # 极端跳空
    extreme_gap: 0.10

    # 跳空超过阈值后的动作
    extreme_gap_action: "REDUCE_POSITION"

    # 是否限制重大事件前持仓
    event_gap_protection: true


  # ==========================================================
  # 14. Stop Loss
  # 止损风险
  # ==========================================================
  stop_loss:

    enabled: true

    # 固定百分比止损
    fixed:

      enabled: false

      stop_loss_pct: 0.08


    # ATR 止损
    atr:

      enabled: true

      period: 14

      multiplier: 3.0


    # 移动止损
    trailing:

      enabled: true

      trailing_pct: 0.10


    # 止损方式
    method: "ATR"


  # ==========================================================
  # 15. Take Profit
  # 止盈
  # ==========================================================
  take_profit:

    enabled: false

    # 固定止盈
    fixed:

      enabled: false

      take_profit_pct: 0.20

    # 是否允许让盈利继续运行
    trailing_profit: true


  # ==========================================================
  # 16. Options Risk
  # 期权风险
  # ==========================================================
  options:

    enabled: true

    # 最大期权名义金额占净资产比例
    max_notional_ratio: 0.30

    # 最大期权保证金占净资产比例
    max_margin_ratio: 0.20

    # 最大期权组合权重
    max_portfolio_weight: 0.30

    # 最大单个期权仓位
    max_single_position_weight: 0.10


    # --------------------------------------------------------
    # Greeks
    # --------------------------------------------------------
    greeks:

      enabled: true

      # Delta
      max_abs_delta: 0.80

      # Gamma
      max_abs_gamma: 0.10

      # Vega
      max_abs_vega: 0.20

      # Theta
      max_abs_theta: 0.20

      # Portfolio Delta
      max_portfolio_delta: 0.50

      # Portfolio Gamma
      max_portfolio_gamma: 0.10

      # Portfolio Vega
      max_portfolio_vega: 0.30


    # --------------------------------------------------------
    # Implied Volatility
    # --------------------------------------------------------
    implied_volatility:

      enabled: true

      # IV Rank
      max_iv_rank: 0.95

      # IV Percentile
      max_iv_percentile: 0.95

      # IV 极端状态
      extreme_iv_action: "REDUCE_OPTION_RISK"


    # --------------------------------------------------------
    # Time To Expiration
    # --------------------------------------------------------
    expiration:

      enabled: true

      # 最低剩余天数
      min_dte: 7

      # 接近到期警戒
      warning_dte: 14

      # 强制退出
      force_exit_dte: 3


    # --------------------------------------------------------
    # Earnings
    # 财报事件
    # --------------------------------------------------------
    earnings:

      enabled: true

      # 财报前是否限制新开仓
      restrict_new_positions: true

      # 财报前最小限制天数
      restriction_days: 2

      # 是否允许持仓过财报
      allow_hold_through_earnings: true


  # ==========================================================
  # 17. Event Risk
  # 事件风险
  # ==========================================================
  event:

    enabled: true

    # 财报
    earnings: true

    # FDA
    fda: false

    # FOMC
    fomc: true

    # CPI
    cpi: true

    # NFP
    nfp: true

    # 重大宏观事件
    macro_events: true

    # 事件前限制新仓位
    restrict_new_positions: true


  # ==========================================================
  # 18. Order Risk
  # 订单级风险
  # ==========================================================
  order:

    enabled: true

    # 单笔订单最大金额
    max_order_notional: 1000.0

    # 单笔订单最大账户比例
    max_order_ratio: 0.10

    # 每分钟最大订单数
    max_orders_per_minute: 20

    # 每日最大订单数
    max_orders_per_day: 500

    # 最大订单重试次数
    max_retry: 3

    # 订单价格偏离市场价格最大比例
    max_price_deviation: 0.02

    # 是否检查订单数量
    quantity_check: true

    # 是否检查现金
    cash_check: true

    # 是否检查保证金
    margin_check: true


  # ==========================================================
  # 19. Slippage Risk
  # 滑点风险
  # ==========================================================
  slippage:

    enabled: true

    # 最大允许滑点
    max_slippage: 0.005

    # 股票最大滑点
    stock_max_slippage: 0.003

    # 期权最大滑点
    option_max_slippage: 0.010

    # 超过阈值动作
    violation_action: "BLOCK_ORDER"


  # ==========================================================
  # 20. Transaction Cost Risk
  # 交易成本风险
  # ==========================================================
  transaction_cost:

    enabled: true

    # 是否估算手续费
    commission: true

    # 是否估算滑点
    slippage: true

    # 是否估算市场冲击
    market_impact: true

    # 最大预计交易成本占交易金额比例
    max_cost_ratio: 0.01


  # ==========================================================
  # 21. Alpha Decay Risk
  # Alpha 衰减风险
  # ==========================================================
  alpha_decay:

    enabled: true

    # Alpha 监测周期
    lookback: 60

    # IC 最低阈值
    min_ic: 0.02

    # IC 显著下降阈值
    ic_decay_threshold: 0.50

    # Alpha 衰减后的动作
    action: "REDUCE_FACTOR_WEIGHT"


  # ==========================================================
  # 22. Model Risk
  # 模型风险
  # ==========================================================
  model:

    enabled: true

    # 模型最大允许连续错误信号
    max_consecutive_losses: 5

    # 模型最大回撤
    max_model_drawdown: 0.15

    # 模型异常时是否停止交易
    stop_on_model_failure: true

    # 模型输出异常检查
    output_validation: true

    # NaN / Inf 检查
    numerical_validation: true


  # ==========================================================
  # 23. Kill Switch
  # 全局紧急停止
  # ==========================================================
  kill_switch:

    enabled: true

    # 触发条件
    triggers:

      # 账户回撤
      max_drawdown: 0.20

      # VaR
      max_var_ratio: 0.10

      # ES
      max_es_ratio: 0.15

      # 单日亏损
      max_daily_loss: 0.08

      # 连接断开
      broker_disconnect: true

      # 市场数据中断
      market_data_failure: true

      # 风控模块异常
      risk_engine_failure: true

      # 模型异常
      model_failure: true

      # 数据异常
      data_integrity_failure: true


    # Kill Switch 触发动作
    action:

      cancel_open_orders: true

      stop_new_orders: true

      close_positions: false

      disconnect_broker: false

      send_alert: true


  # ==========================================================
  # 24. Daily Loss Limit
  # 单日损失限制
  # ==========================================================
  daily_loss:

    enabled: true

    # 单日最大亏损
    max_loss_ratio: 0.05

    # 警戒线
    warning_ratio: 0.03

    # 达到限制后
    action: "STOP_NEW_TRADES"

    # 下一交易日自动恢复
    reset_next_day: true


  # ==========================================================
  # 25. Risk Budget
  # 风险预算
  # ==========================================================
  risk_budget:

    enabled: true

    # 组合总风险预算
    total: 1.00

    # 股票
    equity: 0.70

    # ETF
    etf: 0.20

    # 期权
    options: 0.10

    # 单行业最大风险预算
    sector_max: 0.30

    # 单股票最大风险预算
    stock_max: 0.10


  # ==========================================================
  # 26. Risk Monitoring
  # 风险监控
  # ==========================================================
  monitoring:

    enabled: true

    # 实时监控
    realtime: true

    # 风控计算频率
    frequency: "1s"

    # 风险报告
    daily_report: true

    # 风险快照
    snapshot: true

    # 保存历史风险数据
    historical_storage: true


  # ==========================================================
  # 27. Risk Alert
  # 风险报警
  # ==========================================================
  alert:

    enabled: true

    levels:

      info: true

      warning: true

      critical: true

      emergency: true

    # 报警冷却时间
    cooldown_seconds: 300

    # 重复报警次数限制
    max_repeated_alerts: 3


  # ==========================================================
  # 28. Risk Actions
  # 风控动作
  # ==========================================================
  actions:

    # 允许的风险动作
    allowed:

      - "ALLOW"
      - "WARN"
      - "REDUCE_POSITION"
      - "REDUCE_RISK"
      - "BLOCK_ORDER"
      - "STOP_NEW_TRADES"
      - "FORCE_DELEVERAGE"
      - "STOP_TRADING"

    # 默认动作
    default: "BLOCK_ORDER"


  # ==========================================================
  # 29. Risk Priority
  # 风控优先级
  # ==========================================================
  priority:

    # 数字越小优先级越高
    kill_switch: 1

    account: 2

    portfolio: 3

    position: 4

    options: 5

    drawdown: 6

    var: 7

    liquidity: 8

    volatility: 9

    correlation: 10

    sector: 11

    order: 12

    slippage: 13

    transaction_cost: 14

    alpha_decay: 15


  # ==========================================================
  # 30. Risk Engine
  # 风控引擎
  # ==========================================================
  engine:

    enabled: true

    # 风控引擎名称
    name: "RiskEngine"

    version: "1.0.0"

    # 是否严格执行优先级
    enforce_priority: true

    # 是否记录所有风控决策
    audit_log: true

    # 是否记录被拒绝订单
    log_rejected_orders: true

    # 是否记录风控指标
    log_risk_metrics: true